worker_processes auto;
worker_rlimit_nofile 65535;
error_log /dev/stderr warn;
pid /run/nginx/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Do not disclose the nginx version in the Server header or on
    # error pages (nearai/infra#194). Applies to every server block
    # rendered into conf.d, so topology changes cannot reintroduce it.
    server_tokens off;

    # admin_audit_request_id is the backend's X-Admin-Audit-Request-Id RESPONSE
    # header: Cloud API sets a server-generated UUID on audited /v1/admin/*
    # responses, including auth denials, so each entry's status and
    # body_bytes_sent can be joined to its audit record. It is never sourced
    # from the request:
    # a client-sent X-Admin-Audit-Request-Id or X-Request-Id is forwarded to
    # the backend unchanged and is not an audit key. "-" = no such header
    # (non-admin route, or no backend response: nginx answered itself or could
    # not reach the backend); "" = header present but empty. nginx escapes
    # quotes, backslashes and control bytes in logged values; match this last
    # field anchored at end of line, since client-controlled fields before it
    # ($request, $http_user_agent) can contain the same text
    # (tests/test-admin-audit-log.sh).
    # $remote_addr (this nginx's TCP peer) and $http_x_forwarded_for (as
    # received) are not verified public client IPs.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time '
                    'admin_audit_request_id="$upstream_http_x_admin_audit_request_id"';

    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    include /etc/nginx/conf.d/*.conf;
}
