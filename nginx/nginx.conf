worker_processes auto;
worker_rlimit_nofile 65535;
# entrypoint.sh filters stderr through nginx/redact-error-log.sed.
error_log /dev/stderr warn;
pid /run/nginx/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Do not disclose the nginx version in the Server header or on
    # error pages (nearai/infra#194). Applies to every server block
    # rendered into conf.d, so topology changes cannot reintroduce it.
    server_tokens off;

    # admin_audit_request_id is the backend's X-Admin-Audit-Request-Id RESPONSE
    # header: Cloud API sets a server-generated UUID on audited /v1/admin/*
    # responses, including auth denials, so each entry's status and
    # body_bytes_sent can be joined to its audit record. It is never sourced
    # from the request:
    # a client-sent X-Admin-Audit-Request-Id or X-Request-Id is forwarded to
    # the backend unchanged and is not an audit key. "-" = no such header
    # (non-admin route, or no backend response: nginx answered itself or could
    # not reach the backend); "" = header present but empty. nginx escapes
    # quotes, backslashes and control bytes in logged values; match this last
    # field anchored at end of line, since client-controlled fields before it
    # (the request path, $http_user_agent) can contain the same text
    # (tests/test-admin-audit-log.sh).
    # $remote_addr is this nginx's TCP peer.

    # "-" when the header is empty, a fixed marker otherwise.
    map $http_x_forwarded_for $log_proxy_chain {
        ""       "-";
        default  "[redacted]";
    }

    # Clients sometimes put credentials in URLs (?api_key=, ?token=, OAuth
    # ?code=) or send an API key as the Basic auth user name. The access log
    # therefore records the request path and the Referer without their query
    # string or fragment, logs "-" in place of $remote_user, and replaces a
    # path or Referer that still contains a credential-shaped token with
    # "[redacted]" (tests/test-admin-audit-log.sh).
    map $request_uri $log_uri_path {
        "~^(?<log_uri_path_only>[^?#]+)"  $log_uri_path_only;
        default  "-";
    }
    map $log_uri_path $log_request_path {
        "~(^|[^A-Za-z0-9]|%[0-9A-Fa-f]{2})(sk-[A-Za-z0-9]{16}|adm_[A-Za-z0-9_-]{16}|sess_[A-Za-z0-9_-]{16}|eyJ[A-Za-z0-9_-]{10,}\.)"  "[redacted]";
        default  $log_uri_path;
    }
    map $http_referer $log_referer_base {
        "~^(?<log_referer_only>[^?#]+)"  $log_referer_only;
        default  "-";
    }
    map $log_referer_base $log_referer {
        "~(^|[^A-Za-z0-9]|%[0-9A-Fa-f]{2})(sk-[A-Za-z0-9]{16}|adm_[A-Za-z0-9_-]{16}|sess_[A-Za-z0-9_-]{16}|eyJ[A-Za-z0-9_-]{10,}\.)"  "[redacted]";
        default  $log_referer_base;
    }

    log_format main '$remote_addr - - [$time_local] "$request_method $log_request_path $server_protocol" '
                    '$status $body_bytes_sent "$log_referer" '
                    '"$http_user_agent" "$log_proxy_chain" '
                    'rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time '
                    'admin_audit_request_id="$upstream_http_x_admin_audit_request_id"';

    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    include /etc/nginx/conf.d/*.conf;
}
