services:
  ingress:
    build: .
    environment:
      DOMAIN: "api.example.com"
      CERTBOT_EMAIL: "you@example.com"
      CLOUDFLARE_API_TOKEN: "${CLOUDFLARE_API_TOKEN}"
      S3_BUCKET: "your-certs-bucket"
      S3_PREFIX: "your-prefix"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
      AWS_DEFAULT_REGION: "us-west-2"
      BACKEND_HOST: "your-backend"
      BACKEND_PORT: "3000"
      STAGING: "true"
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
    ports:
      # TCP for HTTP/1.1 and HTTP/2 over TLS.
      - "8443:8443/tcp"
      # UDP for HTTP/3 (QUIC). The container advertises h3=":8443" via Alt-Svc;
      # clients only upgrade when the UDP path reaches the listener.
      - "8443:8443/udp"
