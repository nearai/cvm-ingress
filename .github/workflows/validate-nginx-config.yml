name: Validate nginx config

# Builds the image from this repo's Dockerfile, renders both nginx templates
# the way entrypoint.sh does, and runs `nginx -t` inside that image — so the
# check exercises the exact nginx binary and tooling that ship, catching
# config syntax errors before an image is published or promoted.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  nginx-config-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render templates and run nginx -t
        run: ./validate-nginx-config.sh
