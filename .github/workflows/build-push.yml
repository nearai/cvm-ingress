name: Build and Push

# Builds and publishes the cvm-ingress image via the SAME reproducible harness
# that reproducible-build.yml verifies: ./build-image.sh (pinned
# moby/buildkit:v0.20.2 + SOURCE_DATE_EPOCH=0 + rewrite-timestamp) producing a
# single-manifest OCI archive, then `skopeo copy` of that archive to the
# registry. This mirrors nearai/dstack-vpc's build.yml.
#
# Why not docker/build-push-action: it builds on setup-buildx-action's default
# (unpinned) BuildKit with no rewrite-timestamp and attaches an inline
# provenance attestation, which makes the published image an OCI *index* whose
# layer-tar serialization depends on the BuildKit version. The result is bytes
# that are content-identical to the reproducible build but whose published
# manifest digest can NOT be reproduced from `./build-image.sh` — so a verifier
# (or the TEE attestation report) sees a digest no one can independently
# rebuild. Driving the publish through build-image.sh makes the deployed digest
# == the digest reproducible-build.yml validates == what `./build-image.sh`
# yields on any native-amd64 host.
#
# Provenance + signature are attached as OCI referrers (attest-build-provenance
# push-to-registry + keyless cosign) rather than index entries, so the image
# manifest stays single and reproducible.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_REPOSITORY: nearaidev/cvm-ingress

jobs:
  build-push:
    name: Reproducible Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: nearaidev
          password: ${{ secrets.DOCKER_REGISTRY_TOKEN }}

      - name: Determine image tag
        run: |
          if [[ "${GITHUB_REF_TYPE}" == 'tag' ]]; then
            TAG=${GITHUB_REF_NAME#v}
          else
            # main → :staging (continuously-integrated channel the
            # cloud-api-staging ingress tracks). :latest is the promoted prod
            # channel, moved only by promote.yml — never by a main push.
            TAG='staging'
          fi
          echo "IMAGE_REFERENCE=${{ env.REGISTRY }}/${{ env.IMAGE_REPOSITORY }}:${TAG}" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo jq

      - name: Build and push reproducible image
        run: |
          ./build-image.sh --push "${{ env.IMAGE_REFERENCE }}"

      - name: Get image digest
        run: |
          DIGEST=$(skopeo inspect oci-archive:./oci.tar | jq -r '.Digest')
          if [ -z "${DIGEST}" ] || [ "${DIGEST}" = "null" ]; then
            echo "Failed to get image digest from OCI archive" >&2
            exit 1
          fi
          echo "IMAGE_DIGEST=${DIGEST}" >> "$GITHUB_ENV"

      - name: Generate artifact attestation (GitHub)
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_REPOSITORY }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image with cosign (keyless)
        run: |
          cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_REPOSITORY }}@${{ env.IMAGE_DIGEST }}"

      - name: Generate build summary
        run: |
          {
            echo "## cvm-ingress docker image"
            echo ""
            echo "- tag: \`${{ env.IMAGE_REFERENCE }}\`"
            echo "- digest: \`${{ env.IMAGE_DIGEST }}\`"
            echo "- commit: \`${{ github.sha }}\`"
            echo "- reproduce: \`./build-image.sh\` then \`skopeo inspect oci-archive:./oci.tar | jq -r .Digest\` on a native-amd64 host"
            echo "- sigstore: https://search.sigstore.dev/?hash=${{ env.IMAGE_DIGEST }}"
          } >> "$GITHUB_STEP_SUMMARY"
